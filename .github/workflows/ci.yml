name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: financas
          POSTGRES_PASSWORD: financas
          POSTGRES_DB: financas_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U financas -d financas_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run ruff check
        run: ruff check

      - name: Run ruff format check
        run: ruff format --check

      - name: Run tests with coverage
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://financas:financas@localhost:5432/financas_test
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80
